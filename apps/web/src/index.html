<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SaaS Starter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before first paint, so there's no flash: the stored choice (light or
      // dark), else the OS colour scheme, as the `.dark` class the spartan
      // theme uses. ThemeService (same storage key) takes over once the app
      // runs, including live OS changes while on "system".
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('saas-starter.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        // The browser UI too (THEME_COLORS in theme.service.ts).
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].content = dark ? '#09090b' : '#ffffff';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
