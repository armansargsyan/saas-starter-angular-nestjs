<main
  class="mx-auto flex min-h-dvh max-w-xl flex-col items-center justify-center gap-6 p-6 text-center"
>
  <h1 class="text-3xl font-semibold tracking-tight">SaaS Starter</h1>
  <p class="text-muted-foreground">
    Angular 22 + NestJS 11 starter. Demo app: a link shortener with analytics.
  </p>

  <div class="flex items-center gap-2 text-sm" aria-live="polite">
    <span class="text-muted-foreground">API status</span>
    @switch (status()) { @case ('ok') {
    <span hlmBadge data-testid="api-status">ok</span>
    } @case ('down') {
    <span hlmBadge variant="destructive" data-testid="api-status"
      >unreachable</span
    >
    } @default {
    <span hlmBadge variant="secondary" data-testid="api-status">checking…</span>
    } }
  </div>

  <button
    hlmBtn
    variant="outline"
    type="button"
    [disabled]="health.isLoading()"
    (click)="health.reload()"
  >
    Check again
  </button>
</main>
